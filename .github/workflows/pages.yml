name: Build, validate and deploy atlas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atlas-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decode PWA icons
        run: node tools/decode_icons.js

      - name: Fetch map sources
        run: node tools/fetch_assets.js

      - name: Build projected SVG atlas
        run: node tools/build_borders.js

      - name: Build research GeoJSON
        run: node tools/build_research_geojson.js

      - name: Validate atlas data
        run: node tools/validate.js

      - name: Assemble site
        run: |
          mkdir -p _site/css _site/js _site/data/research _site/vendor _site/assets/icons
          cp index.html wars.html research.html manifest.webmanifest sw.js _site/
          cp css/style.css css/wars.css css/research.css _site/css/
          cp js/app.js js/wars.js js/research.js js/pwa.js _site/js/
          cp data/events.js data/events-meta.js data/events-extra.js data/wars.js data/borders.js _site/data/
          cp data/research/*.geojson data/research/index.json _site/data/research/
          cp vendor/d3.min.js vendor/topojson-client.min.js vendor/maplibre-gl.js vendor/maplibre-gl.css _site/vendor/
          cp assets/icons/*.png assets/icons/*.svg _site/assets/icons/
          touch _site/.nojekyll

      - name: Mirror to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
