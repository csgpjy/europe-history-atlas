name: Deploy atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch map sources
        run: node tools/fetch_assets.js

      - name: Build projected SVG atlas
        run: node tools/build_borders.js

      - name: Validate atlas data
        run: node tools/validate.js

      - name: Assemble site
        run: |
          mkdir -p _site/css _site/js _site/data _site/vendor
          cp index.html _site/
          cp css/style.css _site/css/
          cp js/app.js _site/js/
          cp data/events.js data/borders.js _site/data/
          cp vendor/d3.min.js vendor/topojson-client.min.js _site/vendor/

      - name: Ensure Pages site exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "Pages API HTTP $status"
          cat pages.json || true
          if [ "$status" != "201" ] && [ "$status" != "409" ]; then
            echo "::warning::Could not create Pages site automatically (HTTP $status)"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
